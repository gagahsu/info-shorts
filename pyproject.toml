[project]
name = "infoshorts"
version = "0.1.0"
description = "結構化資訊 → 直式短影音（Remotion 資訊卡 + 逐字字幕 + edge-tts 中文旁白）"
requires-python = ">=3.11"
dependencies = [
  "edge-tts>=7.0",
  "jsonschema>=4.20",
  "typer>=0.12",
  "pydantic>=2.6",
  "kinocut>=1.15",
]

[project.scripts]
infoshorts = "infoshorts.cli:app"

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380", "pytest>=8"]
# edge-tts 失效時的備援（CPU 推論；torch 約 200 MB，模型首次使用會從 Hugging Face 下載約 330 MB）
kokoro = ["kokoro>=0.9.4", "misaki[zh]>=0.9.4", "soundfile>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infoshorts"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
